# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.1"
hooks = [
    {
        id = "biome-check",
        name = "format json and ts",
        files = '\.(jsonc?|tsx?)$',
        exclude = '\.config/biome\.jsonc',
        args = ["--config-path=.config"],
    },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.1.5"
hooks = [
    {
        id = "tombi-format",
        name = "format toml",
        exclude = "uv.lock",
        args = [
            "--offline",
        ]
    },
]

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.21.0"
hooks = [
    {
        id = "yamlfmt",
        name = "format yml",
        args = ["-conf", ".config/yamlfmt.yaml"],
    },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.32"
hooks = [
    {
        id = "rumdl",
        name = "format md",
        # skills/tdd is vendored from mattpocock/skills; keep it byte-identical for diffing
        exclude = '\.github/|setups/programs/opencode/skills/',
        args = ["--fix", "--config", ".config/rumdl.toml"],
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "nixfmt",
        name = "format nix",
        entry = "nixfmt",
        language = "system",
        files = '\.nix$',
    },
]
